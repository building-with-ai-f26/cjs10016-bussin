name: Bussin
options:
  bundleIdPrefix: com.schwaigs
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
targets:
  Bussin:
    type: application
    platform: iOS
    sources: [Bussin, Shared]
    dependencies:
      - package: PostHog
      - target: BussinLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schwaigs.bussin
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
    info:
      path: Bussin/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Bussin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Bussin uses your location to find your nearest shuttle stop, time your walk, and during a trip you start with Go, tell you when to get off. It stays on your phone.
        PostHogApiKey: $(POSTHOG_API_KEY)
        # Go keeps following your trip with the screen off, and shows a lock screen card.
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
  BussinLiveActivity:
    type: app-extension
    platform: iOS
    sources: [BussinLiveActivity, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schwaigs.bussin.LiveActivity
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
    info:
      path: BussinLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Bussin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BussinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BussinTests]
    dependencies:
      - target: Bussin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  Bussin:
    build:
      targets:
        Bussin: all
        BussinTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [BussinTests]
